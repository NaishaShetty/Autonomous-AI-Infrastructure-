name: Full research suite (manual / scheduled)

# The full repository test suite, including the slower real-model
# (torch + transformers) tests. Kept separate from ci.yml so that fast
# checks are not blocked by these. Known, documented, pre-existing
# failure category (not fixed here, per project boundary rules):
#   tests/runtime/test_counterfactual_generalization.py (8 tests) --
#   hardcoded non-hermetic temp-file path in frozen src/runtime/.
# This workflow does not fail the job solely because of that known
# category; it surfaces the full pytest summary for manual review instead.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest tests/ -q --continue-on-collection-errors | tee /tmp/full_suite_output.txt

      - name: Upload full suite output
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-pytest-output
          path: /tmp/full_suite_output.txt

      - name: Summarize known pre-existing failure category
        run: |
          echo "Known pre-existing, frozen-boundary failure category:"
          echo "tests/runtime/test_counterfactual_generalization.py (8 tests) -- non-hermetic temp path in frozen src/runtime/. Not fixed by policy."
          grep -c "^FAILED" /tmp/full_suite_output.txt || true

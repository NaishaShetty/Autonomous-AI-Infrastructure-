name: CI (fast)

# Fast, on-every-push/PR checks: unit tests, benchmark-specific tests,
# schema/leakage/determinism validation, and a Docker build check.
# Deliberately excludes the full repository test suite (including the
# real-model / torch+transformers tests and the known frozen-src/runtime
# non-hermetic failures) -- that lives in full-suite.yml instead so this
# workflow stays fast.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  unit-and-benchmark-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark-specific unit tests
        run: python -m pytest tests/unit/test_phase54_benchmark.py -v

      - name: Run fast unit test subset (excludes real-model / torch tests)
        run: |
          python -m pytest tests/unit -q \
            --ignore=tests/unit/test_real_model_runtime.py \
            --ignore=tests/unit/test_classification_task.py \
            --ignore=tests/unit/test_qa_task.py

      - name: Run the 16-task benchmark (writes + validates + checks determinism)
        run: python scripts/run_phase5_4_benchmark.py --out-dir /tmp/phase6_ci_benchmark_run

      - name: Verify determinism_check reported true for every axis
        run: |
          python - <<'PY'
          import glob, json, sys
          candidates = sorted(glob.glob("/tmp/phase6_ci_benchmark_run/PHASE5_4_BENCHMARK_RESULTS.json"))
          if not candidates:
              print("no benchmark results file found"); sys.exit(1)
          data = json.load(open(candidates[-1]))
          det = data["determinism_check"]
          print("determinism_check:", det)
          if not all(det.values()):
              print("DETERMINISM CHECK FAILED"); sys.exit(1)
          PY

      - name: Schema / leakage validation (part of benchmark run above)
        run: echo "leakage_scan and dataset_audit are asserted inside run_phase5_4_benchmark.py; see its PHASE5_4_VALIDATION_REPORT.md output"

  build-check:
    runs-on: ubuntu-latest
    needs: unit-and-benchmark-tests
    steps:
      - uses: actions/checkout@v4

      - name: Validate package build (setuptools)
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir /tmp/dist || echo "build metadata check only (pyproject.toml declares packages=['src'])"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build check (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autonomous-ai-infrastructure:ci-check
